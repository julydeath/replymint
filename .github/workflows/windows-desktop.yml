name: Build Windows desktop installer

# Manual runs upload the installer as a workflow artifact; pushing a
# `desktop-v*` tag also attaches it to that tag's GitHub release (the same
# release the website's download link points at).
on:
  workflow_dispatch:
  push:
    tags: ['desktop-v*']

permissions:
  contents: write

concurrency:
  group: windows-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - run: npm ci

      # NSIS only — the conf's dmg/app targets are macOS.
      - run: npm run build -- --bundles nsis

      - uses: actions/upload-artifact@v4
        with:
          name: ReplyMint-windows-installer
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      # Prerelease: the website's download links use releases/latest, which must
      # keep resolving to the release that carries ReplyMint-macOS.dmg.
      - name: Attach to release on tag
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/src-tauri/target/release/bundle/nsis/*.exe
          prerelease: true

      # Stable URL for the website: every tagged build also replaces the asset
      # on the fixed `windows-latest` prerelease, so
      # releases/download/windows-latest/ReplyMint-Windows-Setup.exe always
      # serves the newest installer without touching website/index.html.
      - name: Stage installer under stable name
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: pwsh
        run: |
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          Copy-Item $exe.FullName "$env:RUNNER_TEMP/ReplyMint-Windows-Setup.exe"

      - name: Update windows-latest release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-latest
          name: ReplyMint for Windows (latest)
          body: >
            Moving release — always carries the newest Windows installer as
            `ReplyMint-Windows-Setup.exe`. Versioned builds live on the
            `desktop-v*` releases.
          prerelease: true
          files: ${{ runner.temp }}/ReplyMint-Windows-Setup.exe
