[package]
name = "replymint-desktop"
version = "0.1.0"
description = "ReplyMint desktop — global hotkey dictation into any app (VOICE_PLAN D1)"
edition = "2021"

[lib]
name = "replymint_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "net", "io-util"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
cpal = "0.15"
arboard = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"

[target.'cfg(target_os = "macos")'.dependencies]
accessibility-sys = "0.1"
core-foundation = "0.10"

[target."cfg(windows)".dependencies]
uiautomation = "0.25.0"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Threading"] }
